# release.yml
# GitHub Actions workflow لبناء ورفع APK إلى Supabase Storage وإدخال سجل في جدول updates
# ملاحظة: ضع كل القيم الحساسة كـ Secrets في GitHub (Settings -> Secrets)
name: Build and Upload APK

on:
  push:
    branches: ["main"]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      APK_BUCKET: apk                    # اسم الباكت في Supabase (غيّره هنا لو لازم)

    steps:
      # 1) استنساخ المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) إعداد Node (مطلوب لاستخدام npx / supabase CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3) إعداد Java JDK (مطلوب للـ Android build)
      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4) إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5) Cache لمكتبات Dart/Flutter
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      # 6) تثبيت اعتمادات المشروع
      - name: Install Flutter dependencies
        run: flutter pub get

      # 7) إنشاء ملف .env محلي من Secrets
      - name: Create .env file
        run: |
          set -e
          : > .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env
          echo "SUPABASE_PROJECT_REF=${{ secrets.SUPABASE_PROJECT_REF }}" >> .env
          echo "SUPABASE_ACCESS_TOKEN=${{ secrets.SUPABASE_ACCESS_TOKEN }}" >> .env

      # 8) Build release APK مع split-per-abi
      - name: Build release APK
        run: |
          set -euo pipefail
          echo "Building release APK..."
          flutter build apk --release --split-per-abi

      # 9) رفع artifact (arm64 فقط)
      - name: Upload APK as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      # 10) رفع APK إلى Supabase (arm64 فقط)
      - name: Upload APK to Supabase storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          APK_BUCKET: ${{ env.APK_BUCKET }}
        run: |
          set -euo pipefail
          APK_PATH=./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi

          DEST="ss:///${APK_BUCKET}/app_v${{ github.run_number }}.apk"

          echo "Linking supabase project..."
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

          echo "Uploading $APK_PATH to $DEST (using --experimental flag)"
          npx supabase --experimental storage cp "$APK_PATH" "$DEST"

      # 11) إدخال سجل في جدول updates عبر REST API
      - name: Insert update record into updates table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APK_BUCKET: ${{ env.APK_BUCKET }}
        run: |
          set -euo pipefail
          VERSION=${{ github.run_number }}
          APK_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/${APK_BUCKET}/app_v${VERSION}.apk"

          echo "Inserting update record for version $VERSION"
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/updates" \
            -H "apikey: ${SUPABASE_API_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": ${VERSION}, \"apk_url\": \"${APK_URL}\", \"force_update\": false}" \
            --fail

      # 12) طباعة رابط APK العام
      - name: Print APK public URL
        run: |
          echo "APK public URL (if bucket is public):"
          echo "${{ secrets.SUPABASE_URL }}/storage/v1/object/public/${{ env.APK_BUCKET }}/app_v${{ github.run_number }}.apk"
