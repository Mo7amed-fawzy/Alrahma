name: Build & Release APK (tag-based, with Supabase sync)

on:
  push:
    tags:
      - 'v*'   # يعمل عند push لأي tag يبدأ بـ v

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      APK_BUCKET: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Create .env file for Flutter build
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "✅ .env file created for Flutter build"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          echo "🚀 Building universal release APK..."
          flutter build apk --release
          echo "✅ Build finished"

      - name: Rename APK to include tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          APK_NAME="app-${TAG}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Renamed APK -> ${APK_NAME}"

      - name: Create GitHub Release and upload APK
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
        env:
          # this must be a fine-grained PAT or a token with releases:write permission
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construct release download URL
        run: |
          TAG=${TAG}
          APK_NAME=${APK_NAME}
          RELEASE_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}"
          echo "RELEASE_DOWNLOAD_URL=${RELEASE_DOWNLOAD_URL}" >> $GITHUB_ENV
          echo "Release asset URL: ${RELEASE_DOWNLOAD_URL}"

      - name: Sync release into Supabase updates table
        run: |
          TAG_NUMBER=${TAG#v}  # يحول v1.0.8 -> 1.0.8
          echo "Syncing version ${TAG_NUMBER} to Supabase..."
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/updates" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\": \"${TAG_NUMBER}\",
              \"apk_url\": \"${RELEASE_DOWNLOAD_URL}\",
              \"force_update\": false
            }" -sS -o /tmp/sync-response.json || true
          echo "Supabase response:"
          cat /tmp/sync-response.json || true

      - name: Print final info
        run: |
          echo "✅ Build + Release + Sync finished"
          echo "Public release URL: $RELEASE_DOWNLOAD_URL"
