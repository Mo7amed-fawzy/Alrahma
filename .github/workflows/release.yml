name: Build & Release APK (tag-based, with Supabase sync)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      APK_BUCKET: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Create .env file for Flutter build
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "✅ .env file created for Flutter build"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode Android keystore
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Compute keystore cert fingerprints
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail || true
          keytool -list -v -keystore android.keystore -alias "${KEY_ALIAS}" -storepass "${KEYSTORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
            | sed -n '1,200p' > keystore-info.txt || true
          SHA1=$(grep "SHA1:" keystore-info.txt | head -n1 | awk -F'SHA1: ' '{print $2}' | tr -d '\r')
          SHA256=$(grep "SHA256:" keystore-info.txt | head -n1 | awk -F'SHA256: ' '{print $2}' | tr -d '\r')
          echo "KEYSTORE_SHA1=$SHA1" >> $GITHUB_ENV
          echo "KEYSTORE_SHA256=$SHA256" >> $GITHUB_ENV

      - name: Build release APK
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_NUMBER=${TAG#v}
          flutter build apk --release --build-name=${TAG_NUMBER} --build-number=${GITHUB_RUN_NUMBER}

      - name: Sign APK if possible
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SRC_APK="build/app/outputs/flutter-apk/app-release.apk"
          APK_NAME="app-${GITHUB_REF#refs/tags/}.apk"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner sign --ks android.keystore --ks-pass pass:${KEYSTORE_PASSWORD} --ks-key-alias ${KEY_ALIAS} --key-pass pass:${KEY_PASSWORD} --out ${APK_NAME} ${SRC_APK} || true
            if [ ! -f "${APK_NAME}" ] && [ -f "${SRC_APK}" ]; then
              cp "${SRC_APK}" "${APK_NAME}"
            fi
          else
            cp "${SRC_APK}" "${APK_NAME}"
          fi
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Compute APK SHA256
        run: |
          APK=${{ env.APK_NAME }}
          sha256sum "${APK}" | awk '{print $1}' > sha256.txt
          SHA256=$(cat sha256.txt)
          echo "APK_SHA256=${SHA256}" >> $GITHUB_ENV

      - name: Create GitHub Release and upload APK
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Call Supabase sync-apk function
        env:
          SUPABASE_FUNCTIONS_BASE: ${{ secrets.SUPABASE_URL }}
          GH_PAT: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          BODY=$(jq -n --arg tag "$TAG" --arg token "$GH_PAT" '{tag:$tag, token:$token}')
          HTTP_CODE=$(curl -sS -o /tmp/sync-resp.json -w "%{http_code}" -X POST "${SUPABASE_FUNCTIONS_BASE}/functions/v1/sync-apk" \
            -H "Content-Type: application/json" \
            --data-raw "${BODY}" || true)
          echo "sync-apk HTTP_CODE=${HTTP_CODE}"
          cat /tmp/sync-resp.json || true
