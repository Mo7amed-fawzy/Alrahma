name: Build & Release APK (Supabase + GitHub Release)

on:
  push:
    branches:
      - main       # ⬅️ كل Push على main يعمل Release
    tags:
      - 'v*'       # ⬅️ ولو Push tag يعمل Release رسمي
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (only used without tag)'
        required: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      USE_DEBUG_KEYSTORE: ${{ secrets.USE_DEBUG_KEYSTORE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GH_PAT: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ env.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "${{ env.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/alrahma-release.jks
          chmod 600 ~/.android/alrahma-release.jks

      - name: Create debug keystore
        if: env.USE_DEBUG_KEYSTORE == 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -validity 10000

      - name: Build APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            CLEAN_TAG="${TAG#v}"
            APK_NAME="app-${TAG}.apk"
            echo "🔖 Building TAG release: $TAG"
          else
            CLEAN_TAG="${{ github.event.inputs.version || '1.0.0' }}"
            TAG="auto-${GITHUB_RUN_NUMBER}"
            APK_NAME="app-${TAG}.apk"
            echo "🔧 Auto build: $TAG"
          fi

          flutter build apk --release --build-name=${CLEAN_TAG} --build-number=${GITHUB_RUN_NUMBER}

          mv build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "CLEAN_TAG=${CLEAN_TAG}" >> $GITHUB_ENV

      - name: Compute SHA256
        run: |
          sha256sum "${APK_NAME}" | awk '{print $1}' > sha256.txt
          echo "APK_SHA256=$(cat sha256.txt)" >> $GITHUB_ENV

      - name: Create GitHub Release + Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: Build public download URL
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}"
          echo "RELEASE_DOWNLOAD_URL=${RELEASE_URL}" >> $GITHUB_ENV

      - name: Call Supabase sync-apk function
        run: |
          BODY=$(jq -n \
            --arg tag "$CLEAN_TAG" \
            --arg token "$GH_PAT" \
            --arg apk_url "$RELEASE_DOWNLOAD_URL" \
            '{tag:$tag, token:$token, apk_url:$apk_url}')
          
          curl -sS -X POST \
            "${SUPABASE_URL}/functions/v1/sync-apk" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -o /tmp/sync-resp.json

          cat /tmp/sync-resp.json

      - name: Done
        run: |
          echo "🎉 Done!"
          echo "Version: ${CLEAN_TAG}"
          echo "APK: ${APK_NAME}"
          echo "Release: ${RELEASE_DOWNLOAD_URL}"
