name: Build and Upload APK

on:
  push:
    branches: ["main"]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      APK_BUCKET: apk

    steps:
      # 1) Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Node.js for Supabase CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3) Java JDK
      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4) Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5) Cache pub packages
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      # 6) Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 7) Create .env file
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env
          echo "SUPABASE_PROJECT_REF=${{ secrets.SUPABASE_PROJECT_REF }}" >> .env
          echo "SUPABASE_ACCESS_TOKEN=${{ secrets.SUPABASE_ACCESS_TOKEN }}" >> .env

      # ✅ NEW: Increment version.txt
      - name: Increment version
        id: version
        run: |
          if [ ! -f version.txt ]; then echo "0" > version.txt; fi
          VERSION=$(cat version.txt)
          NEW_VERSION=$((VERSION + 1))
          echo $NEW_VERSION > version.txt
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "✅ Using version: $NEW_VERSION"

      # ✅ Build universal APK (NOT split per ABI)
      - name: Build release APK
        run: |
          echo "Building universal release APK..."
          flutter build apk --release

      # Upload APK as artifact (optional)
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-universal
          path: build/app/outputs/flutter-apk/app-release.apk

      # ✅ Upload APK to Supabase
      - name: Upload APK to Supabase storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          APK_BUCKET: ${{ env.APK_BUCKET }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi

          DEST="ss:///${APK_BUCKET}/app_v${{ env.VERSION }}.apk"

          echo "Linking Supabase project..."
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

          echo "Uploading APK..."
          npx supabase --experimental storage cp "$APK_PATH" "$DEST"

      # ✅ Insert update row
      - name: Insert update record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APK_BUCKET: ${{ env.APK_BUCKET }}
        run: |
          APK_URL="${SUPABASE_URL}/storage/v1/object/public/${APK_BUCKET}/app_v${{ env.VERSION }}.apk"

          echo "Posting update record for version ${{ env.VERSION }}"

          curl -s -X POST "${SUPABASE_URL}/rest/v1/updates" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": ${{ env.VERSION }}, \"apk_url\": \"${APK_URL}\", \"force_update\": false}"

      # ✅ Print public URL
      - name: Print APK public URL
        run: |
          echo "✅ APK URL:"
          echo "${{ secrets.SUPABASE_URL }}/storage/v1/object/public/${{ env.APK_BUCKET }}/app_v${{ env.VERSION }}.apk"
