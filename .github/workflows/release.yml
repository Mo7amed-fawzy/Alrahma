name: Build & Release APK (Supabase + GitHub Release)

on:
  push:
    tags:
      - 'v*'   # يعمل عند push لأي tag يبدأ بـ v

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Create .env file for Flutter build
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "✅ .env file created for Flutter build"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_NUMBER=${TAG#v}
          flutter build apk --release --build-name=${TAG_NUMBER} --build-number=${GITHUB_RUN_NUMBER}
          # اسم الـ APK الأصلي
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          # إعادة تسمية APK ليشمل التاج
          APK_NAME="app-${TAG}.apk"
          mv "${APK_SRC}" "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "✅ APK built and renamed -> ${APK_NAME}"

      - name: Compute APK SHA256
        run: |
          APK=${{ env.APK_NAME }}
          sha256sum "${APK}" | awk '{print $1}' > sha256.txt
          SHA256=$(cat sha256.txt)
          echo "APK_SHA256=${SHA256}" >> $GITHUB_ENV
          echo "✅ APK SHA256: ${SHA256}"

      - name: Create GitHub Release and upload APK
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construct release download URL
        run: |
          TAG=${TAG}
          APK_NAME=${APK_NAME}
          RELEASE_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}"
          echo "RELEASE_DOWNLOAD_URL=${RELEASE_DOWNLOAD_URL}" >> $GITHUB_ENV
          echo "✅ Public release URL: ${RELEASE_DOWNLOAD_URL}"

      - name: Call Supabase sync-apk function
        env:
          SUPABASE_FUNCTIONS_BASE: ${{ secrets.SUPABASE_URL }}
          GH_PAT: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=${TAG}
          APK_NAME=${APK_NAME}
          BODY=$(jq -n --arg tag "$TAG" --arg token "$GH_PAT" --arg apk_url "$RELEASE_DOWNLOAD_URL" '{tag:$tag, token:$token, apk_url:$apk_url}')
          HTTP_CODE=$(curl -sS -o /tmp/sync-resp.json -w "%{http_code}" -X POST "${SUPABASE_FUNCTIONS_BASE}/functions/v1/sync-apk" \
            -H "Content-Type: application/json" \
            --data-raw "${BODY}" || true)
          echo "sync-apk HTTP_CODE=${HTTP_CODE}"
          cat /tmp/sync-resp.json || true

      - name: Final info
        run: |
          echo "✅ Build, Release, and Supabase sync completed!"
          echo "APK: ${{ env.APK_NAME }}"
          echo "Release URL: ${{ env.RELEASE_DOWNLOAD_URL }}"
